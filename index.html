<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Telemetry & Track</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --accent-red: #e10600;
      --accent-green: #00d26a;
      --accent-yellow: #ffb800;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title { font-size: 1rem; font-weight: bold; color: var(--accent-red); letter-spacing: 1px; }
    .status-badge { background: rgba(0, 210, 106, 0.15); color: var(--accent-green); padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; border: 1px solid var(--accent-green); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
    }

    .section-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    /* Track Map */
    .track-container {
      position: relative;
      width: 100%;
      height: 140px;
      background: #0f1319;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .track-svg { width: 90%; height: 90%; }

    /* Grid Table */
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; color: var(--text-muted); padding-bottom: 4px; font-weight: 500; font-size: 0.7rem; }
    td { padding: 5px 0; border-top: 1px solid var(--border-color); }

    .player-row { background: rgba(225, 6, 0, 0.2); font-weight: bold; }
    .player-row td { color: #fff; }
    .driver-code { font-weight: bold; width: 40px; }
    .driver-team { color: var(--text-muted); font-size: 0.7rem; }
    .pos-num { width: 22px; text-align: center; }

    /* Pit Lane */
    .pit-box {
      background: rgba(255, 184, 0, 0.1);
      border: 1px dashed var(--accent-yellow);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      margin-top: 4px;
    }
    .pit-status { color: var(--accent-yellow); font-weight: bold; }
    .empty-pit { color: var(--text-muted); font-style: italic; font-size: 0.7rem; text-align: center; padding: 4px; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="title">🏎️ F1 LIVE TELEMETRY</div>
      <div style="font-size: 0.7rem; color: var(--text-muted);" id="gp-info">Round <span id="current-lap">1</span> / 10</div>
    </div>
    <div class="status-badge" id="race-status">GREEN FLAG</div>
  </header>

  <!-- Track Map Card -->
  <div class="card">
    <div class="section-title">Live Track Position</div>
    <div class="track-container">
      <svg class="track-svg" viewBox="0 0 300 120">
        <path d="M 40 60 Q 40 20 90 20 L 210 20 Q 260 20 260 60 Q 260 100 210 100 L 90 100 Q 40 100 40 60 Z" 
              fill="none" stroke="#30363d" stroke-width="6" stroke-dasharray="6 6"/>
        <!-- Player dot -->
        <circle id="map-player-dot" cx="70" cy="60" r="6" fill="var(--accent-red)" />
        <text id="map-player-text" x="70" y="45" fill="#fff" font-size="9" text-anchor="middle" font-weight="bold">HAM</text>
      </svg>
    </div>
  </div>

  <!-- Leaderboard Card -->
  <div class="card">
    <div class="section-title">Full Driver Grid (10 / 10)</div>
    <table>
      <thead>
        <tr>
          <th class="pos-num">#</th>
          <th>DRIVER</th>
          <th>TEAM</th>
          <th style="text-align: right;">GAP / STATUS</th>
        </tr>
      </thead>
      <tbody id="grid-body">
      </tbody>
    </table>
  </div>

  <!-- Pit Lane Card -->
  <div class="card">
    <div class="section-title">⛽ Pit Lane Action</div>
    <div id="pit-lane">
      <div class="empty-pit">No cars currently in Pit Lane</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const defaultDrivers = [
      { code: "NOR", name: "L. Norris", team: "McLaren", status: "LEADER" },
      { code: "VER", name: "M. Verstappen", team: "Red Bull", status: "+1.2s" },
      { code: "PIA", name: "O. Piastri", team: "McLaren", status: "+2.4s" },
      { code: "LEC", name: "C. Leclerc", team: "Ferrari", status: "+3.6s" },
      { code: "HAM", name: "L. Hamilton", team: "Ferrari", status: "+4.8s", isPlayer: true },
      { code: "RUS", name: "G. Russell", team: "Mercedes", status: "+6.0s" },
      { code: "SAI", name: "C. Sainz", team: "Williams", status: "+7.2s" },
      { code: "ALO", name: "F. Alonso", team: "Aston Martin", status: "+8.4s" },
      { code: "ANT", name: "K. Antonelli", team: "Mercedes", status: "+9.6s" },
      { code: "ALB", name: "A. Albon", team: "Williams", status: "+10.8s" }
    ];

    function updateUI(data) {
      const drivers = data.drivers || defaultDrivers;
      const pitDrivers = data.pit || [];
      const lap = data.lap || 1;

      document.getElementById("current-lap").innerText = lap;

      // Render Grid
      const tbody = document.getElementById("grid-body");
      tbody.innerHTML = "";

      drivers.forEach((d, idx) => {
        const row = document.createElement("tr");
        if (d.isPlayer || d.code === "HAM") row.className = "player-row";

        row.innerHTML = `
          <td class="pos-num">${idx + 1}</td>
          <td class="driver-code">${d.code}</td>
          <td class="driver-team">${d.team}</td>
          <td style="text-align: right; font-size: 0.75rem;">${d.status || (idx === 0 ? 'LEADER' : '+' + (idx * 1.2).toFixed(1) + 's')}</td>
        `;
        tbody.appendChild(row);
      });

      // Render Pit Lane
      const pitBox = document.getElementById("pit-lane");
      if (pitDrivers.length > 0) {
        pitBox.innerHTML = pitDrivers.map(d => `
          <div class="pit-box">
            <div>🏎️ <strong>${d.code}</strong> (${d.team})</div>
            <div class="pit-status">BOX BOX</div>
          </div>
        `).join("");
      } else {
        pitBox.innerHTML = `<div class="empty-pit">No cars currently in Pit Lane</div>`;
      }
    }

    // Check if data is passed via Telegram WebApp start_param
    let receivedData = null;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      try {
        receivedData = JSON.parse(decodeURIComponent(tg.initDataUnsafe.start_param));
      } catch (e) {}
    }

    updateUI(receivedData || { drivers: defaultDrivers, pit: [], lap: 1 });
  </script>
</body>
</html>

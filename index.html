<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Telemetry & Pit Lane</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --accent-red: #e10600;
      --accent-green: #00d26a;
      --accent-yellow: #ffb800;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title { font-size: 1.1rem; font-weight: bold; color: var(--accent-red); letter-spacing: 1px; }
    .status-badge { background: rgba(0, 210, 106, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--accent-green); }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .section-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .leaderboard-card, .pit-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: var(--text-muted); padding-bottom: 6px; font-weight: 500; }
    td { padding: 6px 0; border-top: 1px solid var(--border-color); }

    .player-row { background: rgba(225, 6, 0, 0.15); font-weight: bold; }
    .player-row td { color: #fff; }
    
    .driver-code { font-weight: bold; width: 45px; }
    .driver-team { color: var(--text-muted); font-size: 0.75rem; }
    .pos-num { width: 25px; text-align: center; }

    .pit-lane-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pit-box {
      background: rgba(255, 184, 0, 0.1);
      border: 1px dashed var(--accent-yellow);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .pit-status { color: var(--accent-yellow); font-weight: bold; }
    .empty-pit { color: var(--text-muted); font-style: italic; font-size: 0.75rem; text-align: center; padding: 8px; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="title">🏎️ F1 LIVE TELEMETRY</div>
      <div style="font-size: 0.75rem; color: var(--text-muted);" id="gp-name">Bahrain Grand Prix</div>
    </div>
    <div class="status-badge" id="race-status">LIVE</div>
  </header>

  <div class="grid-container">
    <div class="leaderboard-card">
      <div class="section-title">Full Driver Grid (10 / 10)</div>
      <table>
        <thead>
          <tr>
            <th class="pos-num">#</th>
            <th>DRIVER</th>
            <th>TEAM</th>
            <th style="text-align: right;">STATUS</th>
          </tr>
        </thead>
        <tbody id="grid-body">
        </tbody>
      </table>
    </div>

    <div class="pit-card">
      <div class="section-title">⛽ Pit Lane Action</div>
      <div class="pit-lane-container" id="pit-lane">
        <div class="empty-pit">No cars currently in Pit Lane</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const defaultDrivers = [
      { code: "NOR", name: "L. Norris", team: "McLaren", status: "LEADER" },
      { code: "VER", name: "M. Verstappen", team: "Red Bull", status: "+1.2s" },
      { code: "PIA", name: "O. Piastri", team: "McLaren", status: "+2.4s" },
      { code: "LEC", name: "C. Leclerc", team: "Ferrari", status: "+3.6s" },
      { code: "HAM", name: "L. Hamilton", team: "Ferrari", status: "+4.8s", isPlayer: true },
      { code: "RUS", name: "G. Russell", team: "Mercedes", status: "+6.0s" },
      { code: "SAI", name: "C. Sainz", team: "Williams", status: "+7.2s" },
      { code: "ALO", name: "F. Alonso", team: "Aston Martin", status: "+8.4s" },
      { code: "ANT", name: "K. Antonelli", team: "Mercedes", status: "+9.6s" },
      { code: "ALB", name: "A. Albon", team: "Williams", status: "+10.8s" }
    ];

    function renderBoard(drivers, pitDrivers = []) {
      const tbody = document.getElementById("grid-body");
      tbody.innerHTML = "";

      drivers.forEach((d, idx) => {
        const row = document.createElement("tr");
        if (d.isPlayer || d.code === "HAM") row.className = "player-row";

        row.innerHTML = `
          <td class="pos-num">${idx + 1}</td>
          <td class="driver-code">${d.code} <span style="font-size: 0.7rem; font-weight: normal;">${d.name || ''}</span></td>
          <td class="driver-team">${d.team}</td>
          <td style="text-align: right; font-size: 0.8rem;">${d.status || (idx === 0 ? 'LEADER' : '+' + (idx * 1.2).toFixed(1) + 's')}</td>
        `;
        tbody.appendChild(row);
      });

      const pitBox = document.getElementById("pit-lane");
      if (pitDrivers.length > 0) {
        pitBox.innerHTML = pitDrivers.map(d => `
          <div class="pit-box">
            <div>🏎️ <strong>${d.code}</strong> (${d.team})</div>
            <div class="pit-status">BOX BOX (Changing Tires)</div>
          </div>
        `).join("");
      } else {
        pitBox.innerHTML = `<div class="empty-pit">No cars currently in Pit Lane</div>`;
      }
    }

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      try {
        const parsed = JSON.parse(decodeURIComponent(tg.initDataUnsafe.start_param));
        if (parsed.drivers) renderBoard(parsed.drivers, parsed.pit || []);
      } catch (e) {
        renderBoard(defaultDrivers);
      }
    } else {
      renderBoard(defaultDrivers);
    }
  </script>
</body>
</html>
